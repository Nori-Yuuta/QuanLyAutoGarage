<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh Toán — AutoGarage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="css/checkout.css">
  <link rel="stylesheet" href="css/toast.css">
</head>
<body>

<header class="site-header">
  <div class="logo">
    <a href="index.html" style="color:inherit;text-decoration:none">AutoGarage</a>
  </div>
</header>

<main class="checkout-wrapper">
  <a href="cart.html" class="back-link">← Quay lại giỏ hàng</a>
  <h1 class="cart-title">Thông Tin Nhận Hàng</h1>

  <div class="checkout-layout">
    <form class="checkout-form" id="checkout-form">
      <h3 class="form-section-title">Người nhận</h3>

      <div class="form-group">
        <label>Họ và tên người nhận *</label>
        <input type="text" name="name" required>
      </div>
      <div class="form-group">
        <label>Số điện thoại *</label>
        <input type="tel" name="phone" required pattern="[0-9 +]{8,15}">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="Không bắt buộc">
      </div>

      <h3 class="form-section-title">Địa chỉ giao hàng</h3>

      <div class="form-group">
        <label>Tỉnh / Thành phố *</label>
        <select name="province" required>
          <option value="">-- Chọn tỉnh thành --</option>
          <option>TP. Hồ Chí Minh</option>
          <option>Hà Nội</option>
          <option>Đà Nẵng</option>
          <option>Cần Thơ</option>
          <option>Hải Phòng</option>
        </select>
      </div>
      <div class="form-group">
        <label>Quận / Huyện *</label>
        <input type="text" name="district" required>
      </div>
      <div class="form-group">
        <label>Địa chỉ chi tiết (số nhà, đường) *</label>
        <input type="text" name="address" required>
      </div>
      <div class="form-group">
        <label>Ghi chú</label>
        <textarea name="note" rows="3" placeholder="Ví dụ: giao giờ hành chính..."></textarea>
      </div>

      <h3 class="form-section-title">Phương thức thanh toán</h3>
      <div class="payment-options">
        <label class="payment-option">
          <input type="radio" name="payment" value="cod" checked>
          <span>Thanh toán khi nhận hàng (COD)</span>
        </label>
        <label class="payment-option">
          <input type="radio" name="payment" value="bank">
          <span>Chuyển khoản ngân hàng</span>
        </label>
      </div>
    </form>

    <aside class="checkout-summary">
      <h3>Đơn Hàng</h3>
      <div id="checkout-items" class="checkout-items"></div>

      <div class="coupon-box">
        <label>Mã giảm giá</label>
        <div class="coupon-input-row">
          <input type="text" id="coupon-input" placeholder="Nhập mã...">
          <button type="button" id="apply-coupon-btn">Áp dụng</button>
        </div>
        <p id="coupon-msg" class="coupon-msg"></p>
      </div>

      <div class="summary-row"><span>Tạm tính</span><span id="co-subtotal">0 ₫</span></div>
      <div class="summary-row"><span>Phí ship</span><span id="co-shipping">0 ₫</span></div>
      <div class="summary-row" id="discount-row" style="display:none;color:#1b7f3a">
        <span>Giảm giá</span><span id="co-discount">-0 ₫</span>
      </div>
      <div class="summary-row total"><span>Tổng cộng</span><span id="co-total">0 ₫</span></div>

      <button class="btn-checkout" id="place-order-btn" form="checkout-form" type="submit">
        Xác Nhận Đặt Hàng
      </button>
    </aside>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="js/data.js"></script>
<script src="js/toast.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
