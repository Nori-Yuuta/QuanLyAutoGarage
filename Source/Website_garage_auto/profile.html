<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông Tin Khách Hàng — AutoGarage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/toast.css">
</head>
<body class="profile-page">

<header class="site-header">
  <div class="logo">
    <a href="index.html" style="color:inherit;text-decoration:none">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px">
        <path d="M5 17h14M5 17l1.5-6.5A2 2 0 0 1 8.4 9h7.2a2 2 0 0 1 1.9 1.5L19 17M5 17v3M19 17v3"></path>
        <circle cx="7.5" cy="19" r="1.5"></circle>
        <circle cx="16.5" cy="19" r="1.5"></circle>
      </svg>
      AutoGarage
    </a>
  </div>
  <div class="header-actions">
    <button id="logout-btn" class="header-login-btn" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      Đăng Xuất
    </button>
  </div>
</header>

<main class="profile-wrapper">
  <aside class="profile-sidebar">
    <div class="profile-avatar" id="avatar-initial">?</div>
    <h3 id="sidebar-name">Khách hàng</h3>
    <p id="sidebar-email" class="muted">—</p>

    <nav class="profile-nav">
      <a href="#" class="profile-nav-item active" data-panel="info">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        Thông tin cá nhân
      </a>
      <a href="#" class="profile-nav-item" data-panel="password">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        Đổi mật khẩu
      </a>
      <a href="index.html" class="profile-nav-item">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Về trang chủ
      </a>
    </nav>
  </aside>

  <section class="profile-content">
    <!-- PANEL: THÔNG TIN -->
    <div class="panel active" id="panel-info">
      <h2 class="panel-title">Thông Tin Cá Nhân</h2>
      <p class="muted" style="margin-bottom:20px">Cập nhật họ tên, số điện thoại và email của bạn.</p>

      <form id="info-form" class="panel-form">
        <div class="form-group">
          <label>Họ và tên</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-group">
          <label>Số điện thoại</label>
          <input type="tel" name="phone" required pattern="[0-9 +]{8,15}">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required>
        </div>
        <button type="submit" class="auth-submit" style="max-width:220px">Lưu Thay Đổi</button>
      </form>
    </div>

    <!-- PANEL: ĐỔI MẬT KHẨU -->
    <div class="panel" id="panel-password">
      <h2 class="panel-title">Đổi Mật Khẩu</h2>
      <p class="muted" style="margin-bottom:20px">Để bảo mật, hãy dùng mật khẩu mạnh từ 6 ký tự trở lên.</p>

      <form id="password-form" class="panel-form">
        <div class="form-group">
          <label>Mật khẩu hiện tại</label>
          <input type="password" name="oldPassword" required>
        </div>
        <div class="form-group">
          <label>Mật khẩu mới</label>
          <input type="password" name="newPassword" minlength="6" required>
        </div>
        <div class="form-group">
          <label>Xác nhận mật khẩu mới</label>
          <input type="password" name="confirmPassword" minlength="6" required>
        </div>
        <button type="submit" class="auth-submit" style="max-width:220px">Cập Nhật Mật Khẩu</button>
      </form>
    </div>
  </section>
</main>

<div id="auth-toast" class="toast"></div>

<script src="js/profile.js"></script>
<script src="js/toast.js"></script>
</body>
</html>
