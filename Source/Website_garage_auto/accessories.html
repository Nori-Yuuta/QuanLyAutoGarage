<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phụ Kiện Ô Tô — AutoGarage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/page.css">
  <link rel="stylesheet" href="css/toast.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px">
      <path d="M5 17h14M5 17l1.5-6.5A2 2 0 0 1 8.4 9h7.2a2 2 0 0 1 1.9 1.5L19 17M5 17v3M19 17v3"></path>
      <circle cx="7.5" cy="19" r="1.5"></circle>
      <circle cx="16.5" cy="19" r="1.5"></circle>
    </svg>
    AutoGarage
  </a>
  <div class="header-actions">
    <a href="index.html" class="header-login-btn">← Trang chủ</a>
    <a href="cart.html" class="btn-cart" style="text-decoration:none">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.6 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path>
      </svg>
      <span class="cart-count" id="cart-count">0</span>
    </a>
  </div>
</header>

<main class="page-wrapper">
  <section class="page-hero" style="padding:60px 40px 40px">
    <div class="page-hero-content">
      <span class="page-hero-badge">PHỤ KIỆN</span>
      <h1 id="page-title">Phụ Kiện Ô Tô</h1>
      <p id="page-desc">Chọn danh mục để xem các phụ kiện chính hãng, tương thích với nhiều dòng xe.</p>
    </div>
  </section>

  <section class="page-section" style="padding-bottom:20px">
    <div class="filter-tabs" id="cat-tabs">
      <a href="accessories.html" class="filter-tab" data-cat="">Tất cả</a>
      <a href="accessories.html?category=Nội thất" class="filter-tab" data-cat="Nội thất">Nội thất</a>
      <a href="accessories.html?category=Ngoại thất" class="filter-tab" data-cat="Ngoại thất">Ngoại thất</a>
      <a href="accessories.html?category=An toàn" class="filter-tab" data-cat="An toàn">An toàn</a>
      <a href="accessories.html?category=Vận hành" class="filter-tab" data-cat="Vận hành">Vận hành</a>
    </div>
  </section>

  <section class="page-section" style="padding-top:0">
    <div id="acc-grid" class="grid"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <p>© 2024 AutoGarage. Đây là website demo — mọi thông tin chỉ mang tính minh họa.</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/toast.js"></script>
<script>
(function () {
  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  const cartCountEl = document.getElementById('cart-count');
  if (cartCountEl) {
    const cart = JSON.parse(localStorage.getItem('autogarage_cart') || '[]');
    cartCountEl.textContent = cart.reduce((s, i) => s + i.qty, 0);
  }

  const params = new URLSearchParams(location.search);
  const catParam = params.get('category') || '';

  // Highlight tab active
  document.querySelectorAll('.filter-tab').forEach(tab => {
    if (tab.dataset.cat === catParam) {
      tab.classList.add('active');
    }
  });

   // Lấy dữ liệu từ Admin (nếu có) hoặc mặc định từ data.js
  let allAccs = JSON.parse(localStorage.getItem('db_accessories')) || accessoriesData;
  let list = allAccs;

 if (catParam) {
    list = allAccs.filter(a =>
      a.category.toLowerCase() === catParam.toLowerCase()
    );
    title = `Phụ Kiện ${catParam}`;
    desc = `Danh sách phụ kiện thuộc danh mục ${catParam} đang có tại AutoGarage.`;
  }

  document.getElementById('page-title').textContent = title;
  document.getElementById('page-desc').textContent = desc;
  document.title = title + ' — AutoGarage';

  const grid = document.getElementById('acc-grid');
  if (!list.length) {
    grid.innerHTML = '<p style="color:#888;padding:40px;text-align:center;grid-column:1/-1">Không có phụ kiện nào trong danh mục này.</p>';
  } else {
    grid.innerHTML = list.map(acc => `
      <a class="card" href="product.html?type=acc&id=${acc.id}">
        <div class="card-img">${acc.img}</div>
        <div class="card-body">
          <div class="card-brand">${escapeHtml(acc.category)}</div>
          <div class="card-title">${escapeHtml(acc.name)}</div>
          <div class="card-price">${escapeHtml(acc.price)}</div>
        </div>
      </a>
    `).join('');
  }
})();
</script>
</body>
</html>
