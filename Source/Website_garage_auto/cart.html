<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ Hàng — AutoGarage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="css/toast.css">
</head>
<body>

<header class="site-header">
  <div class="logo">
    <a href="index.html" style="color:inherit;text-decoration:none">AutoGarage</a>
  </div>
  <div class="header-actions">
    <a href="index.html" class="header-login-btn">← Trang chủ</a>
  </div>
</header>

<main class="cart-wrapper">
  <a href="index.html" class="back-link">← Tiếp tục mua sắm</a>
  <h1 class="cart-title">Giỏ Hàng Của Bạn</h1>

  <!-- Empty state -->
  <div id="cart-empty" class="cart-empty">
    <div style="font-size:60px;margin-bottom:16px">🛒</div>
    <p>Giỏ hàng trống.</p>
    <a href="index.html#acc-section" class="btn-primary">Xem phụ kiện ngay</a>
  </div>

  <!-- Cart content -->
  <div id="cart-content" class="cart-layout" style="display:none">
    <div class="cart-items" id="cart-items"></div>
    <aside class="cart-summary">
      <h3>Tóm tắt đơn hàng</h3>
      <div class="summary-row"><span>Tạm tính</span><span id="subtotal">0 ₫</span></div>
      <div class="summary-row"><span>Phí ship</span><span id="shipping">30.000 ₫</span></div>
      <div class="summary-row total"><span>Tổng cộng</span><span id="total">0 ₫</span></div>
      <button class="btn-checkout" id="checkout-btn">Đặt Hàng</button>
      <p style="font-size:12px;color:#999;text-align:center;margin-top:12px">
        Miễn phí ship cho đơn từ 500.000 ₫
      </p>
    </aside>
  </div>
</main>

<script src="js/toast.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
