<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Sản Phẩm — AutoGarage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/product.css">
  <link rel="stylesheet" href="css/toast.css">
</head>
<body>

<header class="site-header">
  <div class="logo">
    <a href="index.html" style="color:inherit;text-decoration:none">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px">
        <path d="M5 17h14M5 17l1.5-6.5A2 2 0 0 1 8.4 9h7.2a2 2 0 0 1 1.9 1.5L19 17M5 17v3M19 17v3"></path>
        <circle cx="7.5" cy="19" r="1.5"></circle>
        <circle cx="16.5" cy="19" r="1.5"></circle>
      </svg>
      AutoGarage
    </a>
  </div>
  <div class="header-actions">
    <a href="cart.html" class="btn-cart" style="text-decoration:none">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.6 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path>
      </svg>
      <span class="cart-count" id="cart-count">0</span>
    </a>
  </div>
</header>

<main class="product-wrapper">
  <a href="index.html" class="back-link">← Quay về trang chủ</a>
  <div id="product-detail"></div>

  <section id="compat-section" class="compat-section hidden">
    <h2 class="section-title">Phụ Kiện Tương Thích</h2>
    <div id="compat-grid" class="grid"></div>
  </section>
</main>

<!-- Scripts — thứ tự quan trọng: data → toast → product -->
<script src="js/data.js"></script>
<script src="js/toast.js"></script>
<script src="js/product.js"></script>
</body>
</html>
