<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xe Theo Hãng — AutoGarage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/page.css">
  <link rel="stylesheet" href="css/toast.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px">
      <path d="M5 17h14M5 17l1.5-6.5A2 2 0 0 1 8.4 9h7.2a2 2 0 0 1 1.9 1.5L19 17M5 17v3M19 17v3"></path>
      <circle cx="7.5" cy="19" r="1.5"></circle>
      <circle cx="16.5" cy="19" r="1.5"></circle>
    </svg>
    AutoGarage
  </a>
  <div class="header-actions">
    <a href="index.html" class="header-login-btn">← Trang chủ</a>
    <a href="cart.html" class="btn-cart" style="text-decoration:none">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.6 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path>
      </svg>
      <span class="cart-count" id="cart-count">0</span>
    </a>
  </div>
</header>

<main class="page-wrapper">
  <section class="page-hero" style="padding:60px 40px 40px">
    <div class="page-hero-content">
      <span class="page-hero-badge" id="page-badge">HÃNG XE</span>
      <h1 id="page-title">Xe Đang Bán</h1>
      <p id="page-desc">Chọn hãng xe để xem các mẫu xe chính hãng có sẵn tại AutoGarage.</p>
    </div>
  </section>

  <!-- Bộ lọc hãng -->
  <section class="page-section" style="padding-bottom:20px">
    <div class="filter-tabs" id="brand-tabs">
      <a href="cars.html" class="filter-tab" data-brand="">Tất cả</a>
      <a href="cars.html?brand=toyota" class="filter-tab" data-brand="toyota">Toyota</a>
      <a href="cars.html?brand=honda" class="filter-tab" data-brand="honda">Honda</a>
      <a href="cars.html?brand=ford" class="filter-tab" data-brand="ford">Ford</a>
      <a href="cars.html?brand=mazda" class="filter-tab" data-brand="mazda">Mazda</a>
      <a href="cars.html?brand=bmw" class="filter-tab" data-brand="bmw">BMW</a>
      <a href="cars.html?brand=mercedes" class="filter-tab" data-brand="mercedes">Mercedes-Benz</a>
    </div>
  </section>

  <section class="page-section" style="padding-top:0">
    <div id="cars-grid" class="grid"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <p>© 2024 AutoGarage. Đây là website demo — mọi thông tin chỉ mang tính minh họa.</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/toast.js"></script>
<script>
(function () {
  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  // Cập nhật cart badge
  const cartCountEl = document.getElementById('cart-count');
  if (cartCountEl) {
    const cart = JSON.parse(localStorage.getItem('autogarage_cart') || '[]');
    cartCountEl.textContent = cart.reduce((s, i) => s + i.qty, 0);
  }

  const params = new URLSearchParams(location.search);
  const brandParam = (params.get('brand') || '').toLowerCase();

  // Highlight tab active
  document.querySelectorAll('.filter-tab').forEach(tab => {
    if (tab.dataset.brand === brandParam) {
      tab.classList.add('active');
    }
  });

  // Lọc dữ liệu
  // Lấy dữ liệu từ Admin (nếu có) hoặc mặc định từ data.js
  let allCars = JSON.parse(localStorage.getItem('db_cars')) || carsData;
  let list = allCars;

  if (brandParam) {
    list = allCars.filter(c => c.brand.toLowerCase().includes(brandParam));
    const brandLabel = list[0] ? list[0].brand : brandParam.toUpperCase();
    title = `Xe ${brandLabel}`;
    desc = `Danh sách xe ${brandLabel} chính hãng đang có tại AutoGarage.`;
  }

  document.getElementById('page-title').textContent = title;
  document.getElementById('page-desc').textContent = desc;
  document.title = title + ' — AutoGarage';

  // Render
  const grid = document.getElementById('cars-grid');
  if (!list.length) {
    grid.innerHTML = '<p style="color:#888;padding:40px;text-align:center;grid-column:1/-1">Không có xe nào của hãng này.</p>';
  } else {
    grid.innerHTML = list.map(car => `
      <a class="card" href="product.html?type=car&id=${car.id}">
        <div class="card-img">${car.img}</div>
        <div class="card-body">
          <div class="card-brand">${escapeHtml(car.brand)}</div>
          <div class="card-title">${escapeHtml(car.name)}</div>
          <div class="card-price">${escapeHtml(car.price)}</div>
        </div>
      </a>
    `).join('');
  }
})();
</script>
</body>
</html>
